<body class="bg-earth-gray text-on-background min-h-screen flex flex-col font-body-md antialiased pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="flex items-center px-margin-mobile md:px-margin-tablet h-16 w-full z-50 bg-surface/80 dark:bg-surface-container-low/80 w-full sticky top-0 backdrop-blur-md shadow-sm">
<button class="mr-4 text-on-surface-variant hover:bg-surface-container-high/50 rounded-full p-2 transition-colors active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary dark:text-primary-fixed-dim">Create Profile</h1>
</header>
<main class="flex-grow w-full max-w-3xl mx-auto px-margin-mobile md:px-margin-tablet py-8">
<div class="mb-8 text-center">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-2">Join the Community</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Set up your donor profile to start making an impact.</p>
</div>
<!-- Profile Picture Upload Area (Placeholder) -->
<div class="flex flex-col items-center justify-center mb-10">
<div class="relative w-32 h-32 rounded-full bg-surface-container-high border-4 border-surface shadow-sm flex items-center justify-center mb-4 overflow-hidden group cursor-pointer">
<span class="material-symbols-outlined text-4xl text-outline group-hover:text-primary transition-colors" data-icon="add_a_photo">add_a_photo</span>
<div class="absolute inset-0 bg-black/20 hidden group-hover:flex items-center justify-center transition-all">
<span class="font-label-md text-label-md text-white font-medium">Upload</span>
</div>
</div>
</div>
<form class="space-y-6 bg-surface-container-lowest p-card-padding md:p-8 rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-surface-variant">
<!-- Personal Info Section -->
<section class="space-y-4">
<h3 class="font-headline-sm text-headline-sm text-on-background border-b border-surface-variant pb-2">Personal Information</h3>
<div class="space-y-4 md:space-y-0 md:grid md:grid-cols-2 md:gap-4">
<div class="relative">
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-1" for="fullName">Full Name</label>
<input class="w-full bg-primary/5 border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 rounded-t-md px-4 py-3 font-body-md text-on-background transition-colors" id="fullName" name="fullName" placeholder="Jane Doe" type="text">
</div>
<div class="relative">
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-1" for="email">Email Address</label>
<input class="w-full bg-primary/5 border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 rounded-t-md px-4 py-3 font-body-md text-on-background transition-colors" id="email" name="email" placeholder="jane@example.com" type="email">
</div>
</div>
<div class="relative">

<div class="relative">


</div>
</div>
</section>
<!-- Areas of Interest Section -->
<section class="space-y-4 pt-4">
<h3 class="font-headline-sm text-headline-sm text-on-background border-b border-surface-variant pb-2">Primary Areas of Interest</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-4">Select the causes you are most passionate about to personalize your experience.</p>
<div class="flex flex-wrap gap-3">
<!-- Chip: Education -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="interest" type="checkbox" value="education">
<div class="px-4 py-2 rounded-full border border-outline-variant bg-surface-container-low text-on-surface-variant peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-all flex items-center gap-2 hover:bg-surface-container-high">
<span class="material-symbols-outlined text-[18px]" data-icon="school">school</span>
<span class="font-label-md text-label-md">Education</span>
</div>
</label>
<!-- Chip: Medical -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="interest" type="checkbox" value="medical">
<div class="px-4 py-2 rounded-full border border-outline-variant bg-surface-container-low text-on-surface-variant peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-all flex items-center gap-2 hover:bg-surface-container-high">
<span class="material-symbols-outlined text-[18px]" data-icon="local_hospital">local_hospital</span>
<span class="font-label-md text-label-md">Medical</span>
</div>
</label>
<!-- Chip: Economic Empowerment -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="interest" type="checkbox" value="economic">
<div class="px-4 py-2 rounded-full border border-outline-variant bg-surface-container-low text-on-surface-variant peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-all flex items-center gap-2 hover:bg-surface-container-high">
<span class="material-symbols-outlined text-[18px]" data-icon="trending_up">trending_up</span>
<span class="font-label-md text-label-md">Economic Empowerment</span>
</div>
</label>
<!-- Chip: Environment -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="interest" type="checkbox" value="environment">
<div class="px-4 py-2 rounded-full border border-outline-variant bg-surface-container-low text-on-surface-variant peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-all flex items-center gap-2 hover:bg-surface-container-high">
<span class="material-symbols-outlined text-[18px]" data-icon="eco">eco</span>
<span class="font-label-md text-label-md">Environment</span>
</div>
</label>
<!-- Chip: Community -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="interest" type="checkbox" value="community">
<div class="px-4 py-2 rounded-full border border-outline-variant bg-surface-container-low text-on-surface-variant peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-all flex items-center gap-2 hover:bg-surface-container-high">
<span class="material-symbols-outlined text-[18px]" data-icon="diversity_3">diversity_3</span>
<span class="font-label-md text-label-md">Community</span>
</div>
</label>
</div>
</section>
<div class="pt-6 flex justify-end">
<button class="bg-primary hover:bg-primary/90 text-white rounded-full px-8 py-3 font-label-lg text-label-lg shadow-sm hover:shadow-md active:scale-95 transition-all duration-200" type="submit">
                    Save Profile
                </button>
</div>
</form>
