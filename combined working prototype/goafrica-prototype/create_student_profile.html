<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>GoAfrica Foundation - Student Profile Creation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="js/tailwind-config-donor.js"></script>
<style>
        body { background-color: theme('colors.surface'); color: theme('colors.on-surface'); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .input-field {
            width: 100%;
            background-color: rgba(118, 167, 47, 0.05); /* Primary Green 5% opacity */
            border: none;
            border-bottom: 2px solid theme('colors.outline-variant');
            padding: 12px 16px;
            font-family: theme('fontFamily.body-md');
            font-size: 16px;
            color: theme('colors.on-surface');
            border-radius: 4px 4px 0 0;
            transition: border-color 0.2s ease;
        }
        .input-field:focus {
            outline: none;
            border-bottom-color: theme('colors.primary');
        }
        .input-label {
            display: block;
            font-family: theme('fontFamily.label-md');
            font-size: 12px;
            color: theme('colors.on-surface-variant');
            margin-bottom: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen flex flex-col pt-16 pb-24 md:pb-8">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile h-16 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md shadow-sm">
<button class="flex items-center justify-center p-2 text-primary dark:text-primary-fixed hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold text-primary dark:text-primary-fixed">Create Profile</h1>
<div class="w-10 h-10"></div> <!-- Placeholder for alignment -->
</header>
<main class="flex-grow container mx-auto px-margin-mobile md:px-margin-desktop py-8 max-w-2xl">
<div class="bg-foundation-white rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-surface-container-high p-card-padding">
<h2 class="font-headline-md text-headline-md text-primary mb-2">Tell Us About Yourself</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-6">Complete your profile to connect with sponsors who want to support your educational journey.</p>
<form class="space-y-6">
<!-- Profile Picture Upload -->
<div class="flex flex-col items-center mb-8">
<div class="w-24 h-24 rounded-full bg-surface-container-high flex items-center justify-center mb-4 relative overflow-hidden border-2 border-dashed border-outline-variant">
<span class="material-symbols-outlined text-4xl text-outline" data-icon="add_a_photo">add_a_photo</span>
<input accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" type="file">
</div>
<span class="font-label-md text-label-md text-primary font-semibold">Upload Photo</span>
</div>
<!-- Personal Info -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div>
<label class="input-label">First Name</label>
<input class="input-field" placeholder="E.g. Thabo" type="text">
</div>
<div>
<label class="input-label">Last Name</label>
<input class="input-field" placeholder="E.g. Mbeki" type="text">
</div>
</div>
<!-- Education -->
<div class="space-y-4">
<h3 class="font-label-lg text-label-lg text-primary uppercase tracking-wider">Education Details</h3>
<div>
<label class="input-label">Current Education Level</label>
<select class="input-field appearance-none">
<option value="">Select Level</option>
<option value="primary">Primary School</option>
<option value="high">High School</option>
<option value="university">University / College</option>
</select>
</div>
<div>
<label class="input-label">School / Institution Name</label>
<input class="input-field" placeholder="Enter school name" type="text">
</div>
<div>


</div>
</div>
<!-- Story & Aspirations -->
<div class="space-y-4">
<h3 class="font-label-lg text-label-lg text-primary uppercase tracking-wider">Your Story</h3>
<div>
<label class="input-label">My Personal Story</label>
<textarea class="input-field min-h-[100px] resize-none" placeholder="Share a bit about your background and current situation..."></textarea>
</div>
<div>
<label class="input-label">My Dream (Aspirations)</label>
<textarea class="input-field min-h-[100px] resize-none" placeholder="What do you want to achieve with your education?"></textarea>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-4 rounded-full shadow-md hover:shadow-lg hover:bg-surface-tint transition-all active:scale-95 flex items-center justify-center gap-2" type="submit">
                    Save Profile
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</div>
</main>
<!-- Suppressed BottomNavBar as this is a transactional/onboarding flow -->

<script>
    document.querySelector('form').addEventListener('submit', function (e) {
        e.preventDefault();
        window.location.href = 'sign_in.html?role=student';
    });
</script>

</body></html>
