<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>GoAfrica Foundation - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="js/tailwind-config-donor.js"></script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .input-focus-ring:focus-within {
            border-color: #436900;
            box-shadow: 0 1px 0 0 #436900;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center font-body-md antialiased">
<div class="w-full max-w-[400px] px-margin-mobile py-8 flex flex-col h-full justify-between">
<!-- Header Section -->
<div class="text-center mt-12 mb-8">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container text-on-primary-container mb-4 shadow-sm"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuAzCGPpzeywVXw0ikhKMxBOWlrG3A4C9w_teE0O_AmJR4FRy-nPlKW3ZRvIIENe69-j2V5Ox_UtmOfJ5ke3tVVv7bUSgyuoOhXWPLe10jWZU9RGKxAfVHwusfkDxWQGICKaoVWRhJpy1jWAx1bKSLg15HOCmliB8jxDBi1knaXT0H308WsvRE_xh1MIQOXaoRKVvX5RVP1MjEHAhXflURlakLmQSB6zXe1zwT5q1BLXgbpcIYwNa8dbbg1XoZePeA4c6g" alt="GoAfrica Foundation Logo" class="w-full h-full rounded-full object-cover"></div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">Join the Community</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create an account to make a difference.</p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-4 w-full">
<div class="relative bg-primary/5 rounded-t-lg border-b border-outline-variant input-focus-ring transition-colors">
<label class="absolute top-2 left-4 font-label-md text-label-md text-on-surface-variant" for="fullName">Full Name</label>
<input class="w-full pt-6 pb-2 px-4 bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface placeholder:text-transparent" id="fullName" placeholder="Full Name" type="text">
</div>
<div class="relative bg-primary/5 rounded-t-lg border-b border-outline-variant input-focus-ring transition-colors">
<label class="absolute top-2 left-4 font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<input class="w-full pt-6 pb-2 px-4 bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface placeholder:text-transparent" id="email" placeholder="Email Address" type="email">
</div>
<div class="relative bg-primary/5 rounded-t-lg border-b border-outline-variant input-focus-ring transition-colors">
<label class="absolute top-2 left-4 font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<input class="w-full pt-6 pb-2 px-4 pr-12 bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface placeholder:text-transparent" id="password" placeholder="Password" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<button class="w-full bg-primary text-on-primary py-4 rounded-full font-label-lg text-label-lg shadow-sm hover:shadow-md active:scale-[0.98] transition-all mt-4 flex items-center justify-center gap-2" type="submit">
                Create Account
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Social & Footer Section -->
<div class="mt-8 flex flex-col gap-6">
<div class="flex items-center gap-4 w-full">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-label-md text-label-md text-on-surface-variant">or sign up with</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<div class="flex gap-4">
<button class="flex-1 bg-surface-container-lowest border border-outline-variant py-3 rounded-full flex justify-center items-center gap-2 hover:bg-surface-variant/50 transition-colors shadow-[0_2px_4px_rgba(0,0,0,0.02)] active:scale-[0.98]">
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
</button>
<button class="flex-1 bg-surface-container-lowest border border-outline-variant py-3 rounded-full flex justify-center items-center gap-2 hover:bg-surface-variant/50 transition-colors shadow-[0_2px_4px_rgba(0,0,0,0.02)] active:scale-[0.98]">
<svg class="w-5 h-5 text-[#1877F2]" fill="currentColor" viewBox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
</button>
</div>
<div class="text-center mt-4 mb-safe">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-label-lg font-bold hover:underline" href="sign_in.html" id="signInLink">Sign In</a>
</p>
</div>
</div>
</div>

<script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var role = params.get('role') || 'donor';

        var signInLink = document.getElementById('signInLink');
        if (signInLink) {
            signInLink.href = 'sign_in.html?role=' + encodeURIComponent(role);
        }

        var form = document.querySelector('form');
        if (form) {
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                if (role === 'student') {
                    window.location.href = 'create_student_profile.html?role=student';
                } else {
                    window.location.href = 'create_donor_profile.html?role=donor';
                }
            });
        }
    })();
</script>
</body></html>
