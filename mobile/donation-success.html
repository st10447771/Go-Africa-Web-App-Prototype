<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Donation Successful - GoAfrica</title>
  <link rel="stylesheet" href="mobile-style.css">
</head>
<body>

  <div class="mobile-frame no-nav">

    <div class="success-page">

      <div class="success-photo">TM</div>
      <div class="impact-label">Impact Made</div>
      <h2>Thank You!</h2>
      <div class="success-sub">Donation Successful</div>
      <p class="success-msg">
        Your generous contribution will help Thabo M. continue his education
        and move closer to his dream of becoming a doctor. Every rand makes a difference.
      </p>

      <div class="donated-box">
        <label>Total Donated</label>
        <div class="amount" id="success-amount">R 4,407.50</div>
      </div>

      <div class="success-actions">
        <a href="student-profile.html" class="btn-primary">Return to Directory</a>
        <a href="initiatives.html" class="btn-outline">View Impact Report</a>
      </div>

      <div class="share-section">
        <h3>Share Your Impact</h3>
        <div class="share-row">
          <input type="text" class="share-input" value="goafrica.org/impact/share/abc123" readonly>
          <button class="btn-share" id="btn-share-link">Share</button>
        </div>
      </div>

    </div>

  </div>

  <div class="toast" id="toast"></div>
  <script src="mobile-script.js"></script>
</body>
</html>
