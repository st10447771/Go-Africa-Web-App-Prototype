<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col items-center justify-center p-margin-mobile relative overflow-hidden">
<!-- Abstract Background Pattern -->
<div class="absolute inset-0 pointer-events-none opacity-20">
<svg class="w-full h-full" preserveAspectRatio="none" viewBox="0 0 100 100">
<path d="M0,0 Q50,100 100,0 V100 H0 Z" fill="#a2d659" opacity="0.5"></path>
<path d="M0,100 Q50,0 100,100 V0 H0 Z" fill="#ffce5b" opacity="0.3"></path>
</svg>
</div>
<!-- Main Content Container -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_4px_24px_rgba(0,0,0,0.06)] p-card-padding relative z-10">
<!-- Header Section -->
<div class="text-center mb-8 flex flex-col items-center">
<div class="w-16 h-16 bg-primary-container/20 rounded-full flex items-center justify-center mb-4"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBmCbOIVoMjFviMTYyqMteLj4lx1hFMfSoqdpmDFtyPnJLFMEgDC-uhoDh_MkNnv9eEN-LZEbzMB-ftZTJcbByykC9j-SURLBfWCgeyhhZbj2DM3KtN4fNAQhc9JSdmVkYN6F5-VUO544s5CQGw9jeZF4PFswGrMHiqBUwcWgh9he7Y4sUpqr_rSoKSlqrHCtM9vZdSKk3I95M_-Ojuw5hm8qrJsyyTHyK8txrEKHK3_SOry0WRIEELPT_USf_q2NUn2A" alt="GoAfrica Foundation Logo" class="w-full h-full rounded-full object-cover"></div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Continue your impact with GoAfrica.</p>
</div>
<!-- Login Form -->
<form class="space-y-6">
<!-- Email Input -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-1" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-xl" data-icon="mail">mail</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-primary/5 border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 font-body-md text-body-md text-on-surface rounded-t-lg transition-colors placeholder:text-on-surface-variant/50" id="email" name="email" placeholder="you@example.com" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-1" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-xl" data-icon="lock">lock</span>
</div>
<input class="w-full pl-10 pr-10 py-3 bg-primary/5 border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 font-body-md text-body-md text-on-surface rounded-t-lg transition-colors placeholder:text-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility">visibility</span>
</button>
</div>
<div class="flex justify-end mt-2">
<a class="font-label-lg text-label-lg text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-3.5 rounded-full hover:bg-primary/90 hover:shadow-md active:scale-[0.98] transition-all duration-200 flex justify-center items-center gap-2" type="submit">
                Sign In
                <span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="mt-8 mb-6 flex items-center">
<div class="flex-grow border-t border-surface-variant"></div>
<span class="mx-4 font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Or continue with</span>
<div class="flex-grow border-t border-surface-variant"></div>
</div>
<!-- Social Login -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-2.5 border border-outline-variant rounded-full hover:bg-surface-container-low hover:border-outline transition-colors font-label-lg text-label-lg text-on-surface" type="button">
<svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path><path d="M1 1h22v22H1z" fill="none"></path></svg>
                Google
            </button>
<button class="flex items-center justify-center gap-2 py-2.5 border border-outline-variant rounded-full hover:bg-surface-container-low hover:border-outline transition-colors font-label-lg text-label-lg text-on-surface" type="button">
<svg class="w-5 h-5" fill="#1877F2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path></svg>
                Facebook
            </button>
</div>
<!-- Sign Up Prompt -->
<div class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-lg text-label-lg text-primary hover:text-primary-container transition-colors ml-1" href="#">Sign Up</a>
</p>
</div>
</div>
<!-- Background Decoration -->
<div class="fixed top-0 left-0 w-64 h-64 bg-primary-container opacity-10 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2 z-0"></div>
<div class="fixed bottom-0 right-0 w-80 h-80 bg-secondary-container opacity-10 rounded-full blur-3xl translate-x-1/3 translate-y-1/3 z-0"></div>
